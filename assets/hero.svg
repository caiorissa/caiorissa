    <circle r="95" fill="url(#core)" stroke="#A89BE8" stroke-opacity="0.55"/>
    <ellipse rx="44" ry="95" stroke="#A89BE8" stroke-opacity="0.45"/>
    <ellipse rx="73" ry="95" stroke="#A89BE8" stroke-opacity="0.25"/>
    <ellipse rx="95" ry="33" stroke="#A89BE8" stroke-opacity="0.4"/>
    <ellipse rx="95" ry="66" stroke="#A89BE8" stroke-opacity="0.25"/>
